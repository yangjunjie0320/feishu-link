services:
  feishu-link:
    build: .
    restart: unless-stopped
    volumes:
      - ./config.yaml:/etc/feishu-link/config.yaml:ro
      - ./cookies:/etc/feishu-link/cookies:ro
      - ./logs:/app/logs
      - ./src:/app/src
    environment:
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
