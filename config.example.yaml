# Feishu Link Secretary - configuration example
# Copy to config.yaml and fill in your values.

# Feishu custom app credentials (required)
app_id: "cli_xxx"
app_secret: "xxx"

# mode: A (thread reply in original chat, default) or B (archive channel)
mode: A

# Required only for mode B: the chat_id of your archive channel (oc_xxx)
archive_chat_id: ""

# Optional: YouTube Data API v3 key (for duration + channel info)
# Without this, falls back to OG scraping (no duration).
youtube_api_key: ""

# Regex patterns to allow. If non-empty, only matching URLs are parsed.
link_allowlist:
  - "bilibili\\.com"
  - "b23\\.tv"
  - "instagram\\.com"
  - "tiktok\\.com"
  - "youtube\\.com"
  - "youtu\\.be"
  - "x\\.com"
  - "twitter\\.com"

# Regex patterns to skip even when allowlisted (comma-separated or YAML list)
link_blacklist:
  - "localhost"
  - "127\\.0\\.0\\.1"
  - "v\\.douyin\\.com"
  - "douyin\\.com"
  - "iesdouyin\\.com"

log_level: INFO
log_dir: logs

# HTTP request timeout in seconds
request_timeout: 10.0

# Number of send retry attempts before giving up
send_retry_attempts: 3

# Short video append behavior. Cards are always sent first; videos are best-effort.
video_append_enabled: true
# Applies only to automatic video append. Manual "下载 <link>" ignores this
# artificial short-video threshold and is bounded by file size/upload results.
max_video_duration_seconds: 180
max_video_file_mb: 30
allowed_video_platforms:
  - bilibili
  - instagram
  - tiktok
  - youtube
  - x
video_temp_dir: "/tmp/feishu-link"

# Optional unified Netscape cookie file (relative to the working directory).
# It may contain cookies for multiple domains, including BibiGPT, YouTube, X,
# Instagram, TikTok, and Bilibili.
cookie_file: "cookies/cookies.txt"

# Optional per-platform cookie files. These override cookie_file for a platform
# and use the cookies/{platform}.txt layout.
platform_cookie_files: {}
# Example:
# platform_cookie_files:
#   bibigpt: "cookies/bibigpt.txt"
#   instagram: "cookies/instagram.txt"
#   x: "cookies/x.txt"
#   youtube: "cookies/youtube.txt"

# Optional BibiGPT integration. Mention the bot with a YouTube or Bilibili URL
# to send a summary instead of appending the video.
# Use "web" to call the normal BibiGPT web endpoint. Use "browser" to call the
# same web endpoint from a persisted Chromium profile when direct HTTP fails.
bibigpt_access_mode: "web"
bibigpt_base_url: "https://aitodo.co/zh"
# Model ID passed to BibiGPT's promptConfig.model field. Empty string uses BibiGPT's default.
# Available options include: openai/gpt-5.5, anthropic/claude-sonnet-4-6, gemini-3.5-flash,
# deepseek-v4-pro, and others visible in the aitodo.co settings page model selector.
bibigpt_model: "openai/gpt-5.5"
bibigpt_timeout: 120.0
bibigpt_browser_profile_dir: "browser-data/bibigpt"
bibigpt_browser_headless: true
bibigpt_browser_timeout: 120.0
# Leave empty to use BibiGPT's built-in prompt. Set this only when you want a
# default custom prompt for all summaries.
bibigpt_default_prompt: ""
# After a successful browser-mode request, write the live context cookies back to
# the BibiGPT cookie file so the HTTP path stays fresh as supabase tokens rotate.
bibigpt_cookie_writeback: true

# Cookie auto-refresh for platforms whose exported cookies expire
# (e.g. Bilibili SESSDATA). Bilibili is enabled by default. Each listed platform
# needs a persistent logged-in Chromium profile; before a yt-dlp call, if its
# cookie is missing/near expiry, fresh cookies are exported from the live browser
# context and written back to the platform cookie file. Log in once with
# `python main.py --browser-login <platform>`.
cookie_refresh_enabled: true
cookie_refresh_platforms: ["bilibili"]        # add "x"/"instagram"/"youtube" only after logging in
cookie_refresh_profile_dir: "browser-data/cookies"   # per-platform subdir
cookie_refresh_browser_headless: true
cookie_refresh_browser_timeout: 60.0
cookie_refresh_stale_before_seconds: 86400   # refresh if expiring within 1 day
cookie_refresh_min_interval_seconds: 600     # in-process throttle per platform

# Optional title translation. Only non-Chinese titles are translated.
title_translation_enabled: false
deepseek_api_key: ""
deepseek_base_url: "https://api.deepseek.com"
deepseek_model: "deepseek-chat"
translation_timeout: 10.0

# Comment analysis action. Uses the DeepSeek-compatible chat completions config above.
comment_analysis_max_comments: 500
comment_analysis_prompt_comments: 200
comment_analysis_timeout: 120.0
