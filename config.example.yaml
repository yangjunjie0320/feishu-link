# Feishu Link Secretary - configuration example
# Copy to config.yaml and fill in your values.

# Feishu custom app credentials (required)
app_id: "cli_xxx"
app_secret: "xxx"

# mode: A (thread reply in original chat, default) or B (archive channel)
mode: A

# Required only for mode B: the chat_id of your archive channel (oc_xxx)
archive_chat_id: ""

# Bitable archive: append one row per successfully sent link card.
# Create the base/table once with `python main.py --init-bitable`, then fill in
# the printed tokens. Requires app scopes: bitable:app, drive:drive (bootstrap
# sharing only), im:chat:readonly (resolving sender/chat names).
bitable_enabled: false
bitable_app_token: ""
bitable_table_id: ""

# Daily report: one digest card of the day's archived links, sent at report_time.
report_enabled: false
report_time: "22:00"
report_timezone: "Asia/Shanghai"
report_chat_id: ""   # empty falls back to archive_chat_id
report_chat_ids: []  # extra chats that also receive the same report card

# Optional: YouTube Data API v3 key (for duration + channel info)
# Without this, falls back to OG scraping (no duration).
youtube_api_key: ""

# Regex patterns to allow. If non-empty, only matching URLs are parsed.
link_allowlist:
  - "bilibili\\.com"
  - "b23\\.tv"
  - "instagram\\.com"
  - "tiktok\\.com"
  - "youtube\\.com"
  - "youtu\\.be"
  - "x\\.com"
  - "twitter\\.com"

# Regex patterns to skip even when allowlisted (comma-separated or YAML list)
link_blacklist:
  - "localhost"
  - "127\\.0\\.0\\.1"
  - "v\\.douyin\\.com"
  - "douyin\\.com"
  - "iesdouyin\\.com"

log_level: INFO
log_dir: logs

# HTTP request timeout in seconds
request_timeout: 10.0

# Number of send retry attempts before giving up
send_retry_attempts: 3

# Short video append behavior. Cards are always sent first; videos are best-effort.
video_append_enabled: true
# Applies only to automatic video append. Manual "下载 <link>" ignores this
# artificial short-video threshold and is bounded by file size/upload results.
max_video_duration_seconds: 180
max_video_file_mb: 30
allowed_video_platforms:
  - bilibili
  - instagram
  - tiktok
  - youtube
  - x
video_temp_dir: "/tmp/feishu-link"

# Optional unified Netscape cookie file (relative to the working directory).
# It may contain cookies for multiple domains, including BibiGPT, YouTube, X,
# Instagram, TikTok, and Bilibili.
cookie_file: "cookies/cookies.txt"

# Optional per-platform cookie files. These override cookie_file for a platform
# and use the cookies/{platform}.txt layout.
platform_cookie_files: {}
# Example:
# platform_cookie_files:
#   bibigpt: "cookies/bibigpt.txt"
#   instagram: "cookies/instagram.txt"
#   x: "cookies/x.txt"
#   youtube: "cookies/youtube.txt"

# Optional BibiGPT integration. Mention the bot with a YouTube or Bilibili URL
# to send a summary instead of appending the video.
# Use "web" to call the normal BibiGPT web endpoint. Use "browser" to call the
# same web endpoint from a persisted Chromium profile when direct HTTP fails.
bibigpt_access_mode: "web"
bibigpt_base_url: "https://aitodo.co/zh"
# Model ID passed to BibiGPT's promptConfig.model field. Empty string uses BibiGPT's default.
# Available options include: openai/gpt-5.5, anthropic/claude-sonnet-4-6, gemini-3.5-flash,
# deepseek-v4-pro, and others visible in the aitodo.co settings page model selector.
bibigpt_model: "openai/gpt-5.5"
bibigpt_timeout: 120.0
bibigpt_browser_profile_dir: "browser-data/bibigpt"
bibigpt_browser_headless: true
bibigpt_browser_timeout: 120.0
# Leave empty to use BibiGPT's built-in prompt. Set this only when you want a
# default custom prompt for all summaries.
bibigpt_default_prompt: ""
# After a successful browser-mode request, write the live context cookies back to
# the BibiGPT cookie file so the HTTP path stays fresh as supabase tokens rotate.
bibigpt_cookie_writeback: true
# Reuse a successful default-prompt summary for this long (seconds) without
# calling BibiGPT again, and refuse repeat requests for a video that just failed
# until the cooldown passes. 0 disables either.
bibigpt_summary_cache_ttl_seconds: 1800
bibigpt_failure_cooldown_seconds: 300
# Browser mode: Bilibili uses the desktop's server content pipeline directly.
# Confirm the server content ID, observe subtitle readiness, then summarize once
# with our prompt/model. wait_seconds bounds preparation; it is not a verdict
# that the backend task failed. regenerate is a legacy compatibility setting.
bibigpt_web_queue_enabled: true
bibigpt_web_queue_poll_seconds: 45
bibigpt_web_queue_wait_seconds: 600
bibigpt_web_queue_regenerate: false

# Cookie auto-refresh for platforms whose exported cookies expire
# (e.g. Bilibili SESSDATA). Bilibili is enabled by default.
# Source "chrome" (default): before a yt-dlp call, if the platform cookie is
# missing/near expiry, cookies are extracted from the system Google Chrome's
# cookie store (macOS keychain decryption via yt-dlp). Login state is whatever
# the human keeps logged in by normally using Chrome on this machine; no login
# command needed. First extraction may prompt for keychain access - allow always.
# Source "browser_profile" (legacy fallback): a persistent logged-in Playwright
# profile per platform, seeded once with `python main.py --browser-login <platform>`;
# refresh visits the site headlessly and exports the live context cookies.
cookie_refresh_enabled: true
cookie_refresh_source: "chrome"               # "chrome" | "browser_profile"
cookie_refresh_chrome_profile: ""             # Chrome profile name; empty = default profile
cookie_refresh_platforms: ["bilibili"]        # add "x"/"instagram"/"youtube" once logged in
cookie_refresh_profile_dir: "browser-data/cookies"   # per-platform subdir (browser_profile source)
cookie_refresh_browser_headless: true
cookie_refresh_browser_channel: ""            # e.g. "chrome" to launch real Chrome (browser_profile source)
cookie_refresh_browser_timeout: 60.0
cookie_refresh_stale_before_seconds: 86400   # refresh if expiring within 1 day
cookie_refresh_min_interval_seconds: 600     # in-process throttle per platform
cookie_refresh_max_age_seconds: 43200        # also refresh if cookie file older than 12h (0 disables)
cookie_refresh_reactive_cooldown_seconds: 60 # cooldown for failure-driven refresh

# Optional title translation. Only non-Chinese titles are translated.
title_translation_enabled: false
deepseek_api_key: ""
deepseek_base_url: "https://api.deepseek.com"
deepseek_model: "deepseek-v4-flash"
translation_timeout: 10.0

# Comment analysis action. Uses the DeepSeek-compatible chat completions config above.
comment_analysis_max_comments: 500
comment_analysis_prompt_comments: 200
comment_analysis_timeout: 120.0
comment_fetch_timeout: 90.0                   # wall-clock for the fetch itself (per platform below)

# TikTok comments: driven through the page's own comment panel (click the
# Comments tab, then scroll) and collected by intercepting the responses.
# Hand-built comment/list requests are dropped by the server. Needs a
# logged-in tiktok session -- add "tiktok" to cookie_refresh_platforms.
tiktok_comment_fetch_enabled: true
tiktok_comment_browser_profile_dir: "browser-data/tiktok"   # own profile: delete it to reset
tiktok_comment_browser_headless: true
tiktok_comment_browser_timeout: 45.0          # single Playwright operation
tiktok_comment_fetch_timeout: 120.0           # overrides comment_fetch_timeout for tiktok
tiktok_comment_tab_settle_seconds: 4.0        # tab renders before React binds its handler
tiktok_comment_tab_click_attempts: 3
tiktok_comment_load_timeout: 15.0             # wait for comments after clicking the tab
tiktok_comment_max_scrolls: 25                # each scroll makes the page request one more page
tiktok_comment_scroll_delay: 1.2
tiktok_comment_block_media: true              # skip images/video/fonts; only the JSON matters
# Self-imposed cooldown: TikTok degrades clients that fetch too often, and a
# burst of retries can cost hours of empty responses. Normal use is a few
# fetches a day, so this only bites during debugging. 0 disables.
tiktok_comment_max_per_window: 5
tiktok_comment_window_seconds: 3600.0
