[project]
name = "feishu-link"
version = "0.1.0"
description = "Feishu link secretary: auto-parse URLs from own messages and reply with interactive cards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "tenacity>=8.0",
    "google-api-python-client>=2.0",
    "lark-oapi>=1.3",
    "yt-dlp>=2025.0",
    "playwright>=1.56",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "pyright>=1.1",
]

[[tool.uv.index]]
name = "tuna"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文项目：字符串/注释/文档里大量使用全角标点，RUF001/002/003 全是误报，整族关闭
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "main.py"]
pythonVersion = "3.12"
typeCheckingMode = "off"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that call external services",
]
